[package]
name = "arcade-rom-router"
version = "0.2.0"
description = "Evidence-based arcade ROM identification and automatic emulator routing."
authors = ["Arcade ROM Router contributors"]
edition = "2021"
rust-version = "1.94"
license = "MIT"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which Cargo requires on Windows (rust-lang/cargo#8519).
name = "arcade_rom_router_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = "0.4.45"
quick-xml = { version = "0.41.0", features = ["serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"
# Metadata-only reading: the scanner never decompresses a member, so no
# compression codecs are compiled in (SPEC.md section 43.1).
zip = { version = "8.6.0", default-features = false }

[dev-dependencies]
crc32fast = "1.5.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3.27.0"
walkdir = "2.5.0"
